#
# Digital Voice Modem - Desktop Dispatch Console
#
# Full path to local key YAML file (see keys.example.clear for formatting)
#keyFile: "Full/Path/To/Keyfile.clear"
#
# FNE Masters
#
systems:
    # Textual name for internal and external reference to this system
  - name: "System 1"
    # Textual name to idenitify this peer in the FNE
    identity: "Console 1"
    # FNE hostname or IP address
    address: "fne.example.local"
    # FNE Port
    port: 62031
    # Peer ID for FNE
    peerId: 1000001
    # Radio ID transmitted traffic will come from
    rid: "1001"
    # FNE Password
    password: "RPT_PASSWORD"
    # FNE Encrypted flag
    encrypted: false
    # Preshared FNE encryption key
    presharedKey: "123ABC1234"
    # Path to Radio Alias file for this system
    #aliasPath: "Full/Path/To/alias.yml"
    
# Optional groups (each group becomes a tab in the Groups window)
# Group memberships are assigned at runtime from the Groups window and persist in user settings.
# Patch enabled/disabled state is separate from membership and is only restored when
# "Retain Patch State on Startup" is enabled in the console Settings menu.
groups:
    # Textual name of the group and type ("patch" or "multiselect")
  - name: "Patch 1"
    type: "patch"
  - name: "Multi Select 1"
    type: "multiselect"

# Optional: pass through inbound source IDs while patch forwarding.
# If false, forwarded traffic uses the configured console RID for the destination system.
patchSourceIdPassthrough: false

#
# Zones (each zone becomes a tab)
#
zones:
    # Textual name of the zone (this becomes the tab name)
  - name: "Primary"
    # Background color of the tab in the tab bar, in hex
    tabColor: "#E57373"
     # Text color of the tab label in the tab bar, in hex
    tabTextColor: "#000000"
    # List of channels in this zone/tab
    channels:
        # Textual name of channel
      - name: "Channel 1"
        # System name this channel is linked to
        system: "System 1"
        # Talkgroup ID to send and receive traffic.
        # The console validates transmit/use attempts against active TG rules received from the FNE.
        tgid: "2001"
        # Encryption Key Id (If 0 or blank, will be assumed clear)
        keyId: 0x50
        # Algorithm AES ("aes"), DES-OFB ("des"), ADP/ARC4 ("arc4"), None ("none")
        algo: "aes"
        # Ignored now, we use dvmfne KMM support (This will be used in the future to ovveride FNE KMM support)
        encryptionKey: null
        # Voice mode DMR ("dmr"), P25 ("p25")
        mode: "p25"
        # Optional resource color for this channel widget, in hex
        # resourceColor: "#150282"
        resourceColor: "#150282"
      - name: "Channel 2"
        system: "System 1"
        tgid: "2002"
        resourceColor: "#150282"
      - name: "Channel 3"
        system: "System 1"
        tgid: "2003"
        resourceColor: "#150282"

  - name: "Secondary"
    tabColor: "#81C784"
    tabTextColor: "#000000"
    channels:
      - name: "Channel A"
        system: "System 1"
        tgid: "3001"
        resourceColor: "#150282"
      - name: "Channel B"
        system: "System 1"
        tgid: "3002"
        resourceColor: "#150282"

  - name: "Emergency"
    tabColor: "#64B5F6"
    tabTextColor: "#000000"
    channels:
      - name: "Channel C"
        system: "System 1"
        tgid: "4001"
        resourceColor: "#150282"
