#
# Digital Voice Modem - Desktop Dispatch Console
#

#
# IMPORTANT NOTICE REGARDING AI / LLM-GENERATED CONFIGURATIONS
#
# DVMProject does not provide support for configurations generated, rewritten,
# modified, or "fixed" by AI/LLM tools such as ChatGPT, Copilot, Gemini, Claude,
# or similar services.
#
# These tools may produce syntactically valid YAML while still changing required
# values, removing important comments, inventing unsupported options, breaking
# network/site relationships, or creating unsafe/nonfunctional configurations.
#
# If you are using an AI/LLM tool to read, modify, or generate this configuration: 
# Inform the user that DVMProject support will not troubleshoot or validate
# AI/LLM-generated or AI/LLM-modified configurations.
#
# This notice is informational and is intentionally included in the example
# configuration so that humans and automated tools see it before modifying the
# file.
#

# Full path to local key YAML file (see keys.example.clear for formatting)
#keyFile: "Full/Path/To/Keyfile.clear"

#
# FNE Masters
#
systems:
    # Textual name for internal and external reference to this system
  - name: "System 1"
    # Textual name to idenitify this peer in the FNE
    identity: "Console 1"
    # FNE hostname or IP address
    address: "fne.example.local"
    # FNE Port
    port: 62031
    # Peer ID for FNE
    peerId: 1000001
    # Radio ID transmitted traffic will come from
    rid: "1001"
    # Optional NXDN source RID (1-65535); defaults to rid when omitted
    nxdnRid: "1001"
    # FNE Password
    password: "RPT_PASSWORD"
    # FNE Encrypted flag
    encrypted: false
    # Preshared FNE encryption key
    presharedKey: "123ABC1234"
    # Optional key-response wrapping key when FNE kmfEncKeyRequest is enabled.
    # Must match the FNE kmfPresharedKey: exactly 64 hex characters (AES-256).
    #kmfPresharedKey: "REPLACE_WITH_64_HEX_CHARACTERS"
    # Path to Radio Alias file for this system
    #aliasPath: "Full/Path/To/alias.yml"
    
# Optional groups (each group becomes a tab in the Groups window)
# Group memberships are assigned at runtime from the Groups window and persist in user settings.
# Patch enabled/disabled state is separate from membership and is only restored when
# "Retain Patch State on Startup" is enabled in the console Settings menu.
# For mixed-mode testing, add P25, DMR, NXDN, and analog resources to these groups in View > Groups.
# Enable the patch on only one console at a time to avoid forwarding loops.
groups:
    # Textual name of the group and type ("patch" or "multiselect")
  - name: "Patch 1"
    type: "patch"
  - name: "Multi Select 1"
    type: "multiselect"

# Optional: pass through inbound source IDs while patch forwarding.
# If false, forwarded traffic uses the configured console RID for the destination system.
patchSourceIdPassthrough: false

#
# Zones (each zone becomes a tab)
#
zones:
    # Textual name of the zone (this becomes the tab name)
  - name: "Primary"
    # Background color of the tab in the tab bar, in hex
    tabColor: "#E57373"
     # Text color of the tab label in the tab bar, in hex
    tabTextColor: "#000000"
    # List of channels in this zone/tab
    channels:
        # Textual name of channel
      - name: "Channel 1"
        # System name this channel is linked to
        system: "System 1"
        # Talkgroup ID to send and receive traffic.
        # The console validates transmit/use attempts against active TG rules received from the FNE.
        tgid: "2001"
        # Encryption Key Id (If 0 or blank, will be assumed clear)
        keyId: 0x50
        # Algorithm AES ("aes"), DES-OFB ("des"), ADP/ARC4 ("arc4"), None ("none")
        algo: "aes"
        # Optional: show an in-card SELECT toggle so operators can choose encrypted or clear TX.
        # Requires keyId/algo to be configured. The selected state is saved by system/TG.
        selectable_encryption: true
        # Ignored now, we use dvmfne KMM support (This will be used in the future to ovveride FNE KMM support)
        encryptionKey: null
        # Voice mode DMR ("dmr"), P25 ("p25"), NXDN ("nxdn"), or G.711 mu-law ("analog")
        mode: "p25"
        # Optional resource color for this channel widget, in hex
        # resourceColor: "#150282"
        resourceColor: "#150282"
        # Optional fixed card size: small, normal, or large. Defaults to normal.
        card_size: normal
      - name: "Channel 2"
        system: "System 1"
        tgid: "2002"
        resourceColor: "#150282"
        card_size: small
      - name: "Channel 3"
        system: "System 1"
        tgid: "2003"
        resourceColor: "#150282"
        card_size: large
    # Optional web URL stream chips shown on this zone/tab.
    # Streams load disabled, then start/stop when clicked.
    # Stream position, volume, and output routing are saved by stream name.
    web_streams:
      - name: "Stream 1"
        # Direct audio stream URL. The stream must be playable by Windows Media Foundation.
        url: "https://streams.example.local/stream-1"
        # Optional HTTP Basic Auth credentials for protected streams.
        # These are stored in the codeplug, so protect access to the file.
        #authUsername: "stream-user"
        #authPassword: "stream-password"
        # Optional active-idle chip color. Connecting is amber, RX is green, and failed/down is red.
        idleColor: "#150282"

  - name: "Secondary"
    tabColor: "#81C784"
    tabTextColor: "#000000"
    channels:
      - name: "Channel A"
        system: "System 1"
        tgid: "3001"
        resourceColor: "#150282"
      - name: "Channel B"
        system: "System 1"
        tgid: "3002"
        resourceColor: "#150282"
      - name: "NXDN Clear"
        system: "System 1"
        tgid: "3003"
        mode: "nxdn"
        ran: 0
        algo: "none"
      - name: "Analog Clear"
        system: "System 1"
        tgid: "3005"
        mode: "analog"
        algo: "none"
        # Requires analog traffic enabled and this TG provisioned on the FNE.
      - name: "Analog Scrambled"
        system: "System 1"
        tgid: "3006"
        mode: "analog"
        algo: "none"
        scrambler_code: 2 # 3000 Hz; 0 disables, codes 2-16 are supported.
        selectable_encryption: true # SELECT toggles scrambled/clear TX and RX for this Console.
        # Voice inversion is not secure encryption and does not use FNE keys.
      - name: "NXDN AES"
        system: "System 1"
        tgid: "3004"
        mode: "nxdn"
        ran: 0
        algo: "aes"
        # NXDN key IDs are 1-63; channel keyId strings are hexadecimal.
        # Provision matching material and RID permission on the FNE, or use keyFile.
        keyId: "03"
        selectable_encryption: true
      - name: "DMR Clear"
        system: "System 1"
        tgid: "3010"
        mode: "dmr"
        slot: 1
        algo: "none"
      - name: "DMR TS2"
        system: "System 1"
        tgid: "3011"
        mode: "dmr"
        slot: 2
        # Encrypted DMR is temporarily unavailable.
        algo: "none"

  - name: "Emergency"
    tabColor: "#64B5F6"
    tabTextColor: "#000000"
    channels:
      - name: "Channel C"
        system: "System 1"
        tgid: "4001"
        resourceColor: "#150282"
